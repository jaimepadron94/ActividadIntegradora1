<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido en Línea</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>La Ramona - Pedido en Línea</h1>
    </header>
    <main>
      <section class="product-list">
        <h2>Menú</h2>
        <div class="product">
          <img src="https://via.placeholder.com/150" alt="Producto 1" />
          <h3>Taco al Pastor</h3>
          <p>$25.00 MXN</p>
          <button>Agregar al carrito</button>
        </div>
        <div class="product">
          <img src="https://via.placeholder.com/150" alt="Producto 2" />
          <h3>Quesadilla</h3>
          <p>$30.00 MXN</p>
          <button>Agregar al carrito</button>
        </div>
        <div class="product">
          <img src="https://via.placeholder.com/150" alt="Producto 3" />
          <h3>Enchiladas Verdes</h3>
          <p>$60.00 MXN</p>
          <button>Agregar al carrito</button>
        </div>
      </section>
      <section class="cart">
        <h2>Tu Pedido</h2>
        <ul id="cart-items">
          <!-- Elementos del carrito se añadirán aquí dinámicamente -->
        </ul>
        <p>Total: <span id="cart-total">$0.00 MXN</span></p>
        <button id="checkout">Proceder al Pago</button>
      </section>
    </main>
    <footer>
      <p>&copy; 2024 La Ramona</p>
    </footer>
  </body>
</html>
